<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Transgema mark: a faceted gem whose base extends into forward-motion chevrons (transport) -->
  <defs>
    <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3DE588"/>
      <stop offset="100%" stop-color="#1a7a44"/>
    </linearGradient>
  </defs>

  <!-- Gem top crown -->
  <g>
    <!-- table (top flat) -->
    <polygon points="100,28 128,52 72,52" fill="#3DE588"/>
    <!-- left crown facet -->
    <polygon points="72,52 100,28 64,80" fill="#2ECC71"/>
    <!-- right crown facet -->
    <polygon points="128,52 100,28 136,80" fill="#27b765"/>
    <!-- center crown facet -->
    <polygon points="72,52 128,52 136,80 100,92 64,80" fill="url(#gemGrad)"/>
  </g>

  <!-- Gem pavilion point (forms the leading edge of motion) -->
  <polygon points="64,80 136,80 100,92" fill="#1a7a44"/>

  <!-- Transport / forward-motion chevrons beneath the gem -->
  <g fill="#2ECC71">
    <polygon points="60,108 100,128 140,108 140,120 100,140 60,120" opacity="0.9"/>
    <polygon points="66,134 100,151 134,134 134,144 100,161 66,144" opacity="0.55"/>
    <polygon points="74,160 100,173 126,160 126,168 100,181 74,168" opacity="0.3"/>
  </g>
</svg>
